<title>Kitty 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: one column. The live 3D stage first (square, phone width), then the variant picker, then the concept. */
  :root {
    --bg: #eef1f6;
    --stage: #dde3ec;
    --card: #ffffff;
    --fg: #1f2433;
    --muted: #5d6578;
    --accent: #f08a2e;
    --line: #cfd6e2;
    --display: "Fredoka", "Nunito", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141821; --stage: #20263a; --card: #1c2130; --fg: #eef1f7; --muted: #a3abbe;
      --accent: #f5a65b; --line: #313a50; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141821; --stage: #20263a; --card: #1c2130; --fg: #eef1f7; --muted: #a3abbe;
    --accent: #f5a65b; --line: #313a50; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: grid; gap: 16px; }
  header { display: grid; gap: 2px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0; }
  .stage { position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 100%; background: var(--stage); border-radius: 22px; overflow: hidden; touch-action: none; border: 1px solid var(--line); }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .badge { position: absolute; left: 14px; top: 12px; font-family: var(--display); font-weight: 600; font-size: 15px; padding: 4px 12px; border-radius: 999px; background: var(--card); color: var(--fg); border: 1px solid var(--line); pointer-events: none; font-variant-numeric: tabular-nums; }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
  .stage.showcase .hint { color: #c9cfdc; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--display); }
  .label { font-family: var(--display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .variants button { flex-direction: column; align-items: flex-start; gap: 2px; border-radius: 14px; padding: 8px 10px; text-align: left; }
  .variants .name { display: flex; align-items: center; gap: 8px; }
  .variants .odds { font-family: var(--body); font-weight: 600; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font-family: var(--display); font-weight: 600; font-size: 15px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); flex: none; }
  figure { margin: 0; display: grid; gap: 6px; }
  figure img { border-radius: 14px; border: 1px solid var(--line); background: #b9b9b9; }
  figcaption, .note { font-size: 13px; color: var(--muted); margin: 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facts b { color: var(--fg); font-weight: 700; }
</style>

<div class="wrap">
  <header>
    <h1>Kitty</h1>
    <p class="sub">Cubelings creature · live 3D preview</p>
  </header>

  <div class="stage" id="stage">
    <div class="loading" id="loading">Loading the model…</div>
    <div class="badge" id="badge">Normal</div>
    <div class="hint">Drag to turn · pinch to zoom</div>
  </div>

  <div>
    <p class="label">Variants</p>
    <div class="variants" id="variants"></div>
  </div>

  <div class="row">
    <button id="spin" aria-pressed="true">Auto-turn</button>
    <button id="reset">Front view</button>
  </div>

  <p class="note">This is how the variants could look in the game. The shapes stay the same, only the material and the effects around the creature change.</p>

  <div class="facts">
    <span><b>__TRIS__</b> triangles</span>
    <span><b>1</b> mesh</span>
    <span><b>2 × 2 × 1.9</b> studs body</span>
  </div>

  <figure>
    <img src="data:image/jpeg;base64,__CONCEPT__" alt="The 2D concept sheet of Kitty: front, side, back and three-quarter views of an orange cube cat">
    <figcaption>The 2D concept the model is built from.</figcaption>
  </figure>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
  const GLB = "__GLB__";
  const PALETTE = __PALETTE__;
  // Eye height in model space (the eyes squash toward it to blink)
  const EYE_Y = 1.29;

  const ROLE_IDS = { body: 0, belly: 1, legs: 2, ear_inner: 3, nose: 3, eye: 4, shine: 5, mouth: 6, blush: 7 };
  const roles = new Array(16).fill(0);
  PALETTE.roles.forEach(function (names, i) { roles[i] = ROLE_IDS[names[0]] ?? 0; });

  const VARIANTS = [
    { id: "Normal", odds: "Common", swatch: "#F5A65B", bloom: 0.0, fx: null },
    { id: "Golden", odds: "1 in 50", swatch: "#F2C744", bloom: 0.35, fx: "sparkle" },
    { id: "Crystal", odds: "1 in 250", swatch: "#9FE3FF", bloom: 0.4, fx: "shard" },
    { id: "Lava", odds: "1 in 1,000", swatch: "#FF5A1F", bloom: 1.1, fx: "ember" },
    { id: "Neon", odds: "1 in 5,000", swatch: "#2BF59A", bloom: 1.2, fx: "neon" },
    { id: "Pixel", odds: "1 in 50,000", swatch: "#B98CFF", bloom: 0.8, fx: "pixel" },
  ];

  const stage = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const badge = document.getElementById("badge");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------------------------------------
  // Renderer, scene, post-processing (bloom makes lava and neon actually glow)

  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  function stageColor() {
    const css = getComputedStyle(document.documentElement).getPropertyValue("--stage").trim() || "#dde3ec";
    return new THREE.Color(css).convertSRGBToLinear();
  }
  // Rare variants are shown on a dark showcase so their glow and particles read
  const SHOWCASE = [null, "#1d1a14", "#101a2b", "#160e0c", "#07131a", "#140f26"];
  let current = 0;
  function paintBackground() {
    const dark = SHOWCASE[current];
    scene.background = dark ? new THREE.Color(dark).convertSRGBToLinear() : stageColor();
  }
  paintBackground();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintBackground);
  new MutationObserver(paintBackground).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const home = new THREE.Vector3(0, 2.4, 9.2);
  camera.position.copy(home);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f9bb3, 0.32));
  const key = new THREE.DirectionalLight(0xffffff, 0.85);
  key.position.set(3, 6, 5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xcfe3ff, 0.3);
  rim.position.set(-4, 3, -4);
  scene.add(rim);

  // Soft contact shadow
  const shadowCanvas = document.createElement("canvas");
  shadowCanvas.width = shadowCanvas.height = 128;
  const sctx = shadowCanvas.getContext("2d");
  const grad = sctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  grad.addColorStop(0, "rgba(0,0,0,0.45)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.01;
  scene.add(shadow);

  const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new THREE.EffectComposer(renderer, target);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.0, 0.5, 0.95);
  composer.addPass(bloom);
  // Final pass: soft highlight roll-off and linear -> sRGB
  composer.addPass(new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: [
      "uniform sampler2D tDiffuse; varying vec2 vUv;",
      "vec3 toSRGB(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }",
      "void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;",
      "  vec3 over = max(c - 0.8, 0.0); c = c - over + over / (1.0 + over * 1.5);",
      "  gl_FragColor = vec4(toSRGB(c), 1.0); }"
    ].join("\n")
  }));

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.3, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 4.5;
  controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.autoRotate = !reduced;
  controls.autoRotateSpeed = 1.4;
  controls.update();

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------------------------------------------------------------------------------------------
  // Variant material: the model's palette texture tells each pixel which part it is (body, belly, eye…),
  // so eyes and mouth stay as they are while the body becomes gold, lava rock, neon and so on.

  const uniforms = {
    uVariant: { value: 0 },
    uTime: { value: 0 },
    uBlink: { value: 1 },
    uCells: { value: PALETTE.cells },
    uEyeY: { value: EYE_Y },
    uRole: { value: roles },
  };

  const NOISE = `
    float hash1(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    vec3 hash3(vec3 p){ return vec3(hash1(p), hash1(p + 17.31), hash1(p + 41.7)); }
    float vnoise(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
      return mix(mix(mix(hash1(i+vec3(0,0,0)),hash1(i+vec3(1,0,0)),f.x), mix(hash1(i+vec3(0,1,0)),hash1(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash1(i+vec3(0,0,1)),hash1(i+vec3(1,0,1)),f.x), mix(hash1(i+vec3(0,1,1)),hash1(i+vec3(1,1,1)),f.x),f.y), f.z); }
    // Distance to the nearest Voronoi edge (cracks, facets) and the cell id
    vec2 voronoiEdge(vec3 x, out vec3 cellId){ vec3 n = floor(x); vec3 f = fract(x); float d1 = 8.0, d2 = 8.0; vec3 best = n;
      for (int k=-1;k<=1;k++) for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){ vec3 g = vec3(float(i),float(j),float(k));
        vec3 o = hash3(n + g); vec3 r = g + o - f; float d = dot(r, r);
        if (d < d1){ d2 = d1; d1 = d; best = n + g; } else if (d < d2){ d2 = d; } }
      cellId = best; return vec2(sqrt(d2) - sqrt(d1), sqrt(d1)); }
  `;

  function makeMaterial(map) {
    const mat = new THREE.MeshPhysicalMaterial({ map: map, roughness: 0.5, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.35, envMapIntensity: 0.45 });
    mat.onBeforeCompile = function (shader) {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader
        .replace("#include <common>", "#include <common>\nuniform float uCells; uniform float uBlink; uniform float uEyeY; uniform float uRole[16];\nvarying vec3 vObj; varying float vIdx;")
        .replace("#include <begin_vertex>", [
          "#include <begin_vertex>",
          "vIdx = floor(uv.x * uCells);",
          "vObj = position;",
          "float roleV = uRole[int(vIdx)];",
          "if (roleV > 3.5 && roleV < 5.5) { transformed.y = uEyeY + (transformed.y - uEyeY) * uBlink; }"
        ].join("\n"));
      shader.fragmentShader = shader.fragmentShader
        .replace("#include <common>", "#include <common>\nuniform float uVariant; uniform float uTime; uniform float uRole[16];\nvarying vec3 vObj; varying float vIdx;\n" + NOISE +
          "\nvec3 vtEmissive = vec3(0.0); vec3 vtRim = vec3(0.0); float vtMetal = -1.0; float vtRough = -1.0; float vtClear = -1.0;")
        .replace("#include <map_fragment>", [
          "#include <map_fragment>",
          "float role = uRole[int(vIdx + 0.5)];",
          "bool face = role > 3.5 && role < 6.5;",           // eyes, shine, mouth stay as they are
          "vec3 base = diffuseColor.rgb;",
          "float lum = dot(base, vec3(0.299, 0.587, 0.114));",
          "int v = int(uVariant + 0.5);",
          "if (!face) {",
          "  if (v == 1) {",                                  // Golden: polished metal, glints
          "    vec3 gold = mix(vec3(0.5, 0.25, 0.02), vec3(1.0, 0.7, 0.18), smoothstep(0.05, 0.75, lum));",
          "    if (role > 2.5 && role < 3.5) gold = mix(gold, vec3(1.0, 0.45, 0.35), 0.4);",
          "    diffuseColor.rgb = gold; vtMetal = 1.0; vtRough = 0.16; vtClear = 0.6;",
          "    float sweep = 1.0 - smoothstep(0.0, 0.18, abs(fract((vObj.x + vObj.y) * 0.25 - uTime * 0.25) - 0.5));",
          "    vtEmissive = vec3(1.0, 0.8, 0.4) * sweep * 0.35;",
          "  } else if (v == 2) {",                           // Crystal: icy facets, glossy, cyan rim
          "    vec3 cid; vec2 e = voronoiEdge(vObj * 2.6, cid);",
          "    float facet = 0.78 + 0.35 * hash1(cid);",
          "    vec3 ice = mix(vec3(0.25, 0.6, 0.95), vec3(0.75, 0.92, 1.0), smoothstep(0.1, 0.8, lum));",
          "    diffuseColor.rgb = ice * facet * 0.75; vtRough = 0.06; vtMetal = 0.25; vtClear = 1.0;",
          "    vtEmissive = vec3(0.7, 0.95, 1.0) * (1.0 - smoothstep(0.0, 0.025, e.x)) * 0.35;",
          "    vtRim = vec3(0.3, 0.75, 1.0) * 0.6;",
          "  } else if (v == 3) {",                           // Lava: dark rock with glowing, pulsing cracks
          "    float n = vnoise(vObj * 3.0);",
          "    vec3 rock = vec3(0.045, 0.025, 0.02) * (0.6 + 0.8 * n);",
          "    if (role > 1.5 && role < 2.5) rock *= 0.6;",
          "    vec3 cid; vec2 e = voronoiEdge(vObj * 2.4 + vec3(0.0, uTime * 0.05, 0.0), cid);",
          "    float width = 0.045;",   // the belly is a pool of magma
          "    float crack = 1.0 - smoothstep(0.0, width, e.x);",
          "    if (role > 0.5 && role < 1.5) crack = max(crack, 0.35 + 0.3 * vnoise(vObj * 6.0 + uTime * 0.6));",
          "    float pulse = 0.75 + 0.25 * sin(uTime * 2.2 + n * 6.0);",
          "    float heat = crack * pulse;",
          "    diffuseColor.rgb = mix(rock, vec3(0.6, 0.12, 0.02), crack * 0.6);",
          "    vtEmissive = mix(vec3(0.9, 0.08, 0.0), vec3(1.0, 0.45, 0.05), heat * heat) * heat * 1.8;",
          "    if (role > 2.5 && role < 3.5) vtEmissive = vec3(1.0, 0.35, 0.05) * 1.2 * pulse;",
          "    vtRough = 0.85; vtMetal = 0.0; vtClear = 0.0;",
          "  } else if (v == 4) {",                           // Neon: dark glass, glowing rim and a scan band
          "    diffuseColor.rgb = vec3(0.015, 0.03, 0.035);",
          "    vec3 neon = (role > 0.5 && role < 1.5) ? vec3(0.2, 0.9, 1.0) : vec3(0.15, 1.0, 0.55);",
          "    if (role > 2.5 && role < 3.5) neon = vec3(1.0, 0.25, 0.85);",
          "    float band = 1.0 - smoothstep(0.0, 0.12, abs(fract(vObj.y * 0.45 - uTime * 0.35) - 0.5));",
          "    float pulse = 0.8 + 0.2 * sin(uTime * 3.0);",
          "    vtEmissive = neon * (0.08 + band * 1.2) * pulse;",
          "    vtRim = neon * 1.6 * pulse;",
          "    vtRough = 0.3; vtMetal = 0.0; vtClear = 0.6;",
          "  } else if (v == 5) {",                           // Pixel: little color cubes that shift in waves
          "    vec3 cell = floor(vObj * 5.0);",
          "    float h = hash1(cell);",
          "    float k = mod(floor(h * 4.0 + uTime * 0.7 + cell.y * 0.5), 4.0);",
          "    vec3 c = k < 0.5 ? vec3(0.32, 0.12, 0.85) : k < 1.5 ? vec3(0.85, 0.12, 0.5) : k < 2.5 ? vec3(0.05, 0.55, 0.85) : vec3(0.15, 0.08, 0.45);",
          "    vec3 fr = abs(fract(vObj * 5.0) - 0.5);",
          "    float edge = smoothstep(0.42, 0.5, max(max(fr.x, fr.y), fr.z));",
          "    diffuseColor.rgb = c * (1.0 - edge * 0.45);",
          "    vtEmissive = c * (0.12 + 0.6 * step(0.93, hash1(cell + floor(uTime * 3.0))));",
          "    vtRough = 0.45; vtMetal = 0.0; vtClear = 0.2;",
          "  }",
          "} else if (v == 4 && role > 4.5 && role < 5.5) { vtEmissive = vec3(1.0); }",
          "else {}"
        ].join("\n"))
        .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nif (vtRough >= 0.0) roughnessFactor = vtRough;")
        .replace("#include <metalnessmap_fragment>", "#include <metalnessmap_fragment>\nif (vtMetal >= 0.0) metalnessFactor = vtMetal;")
        .replace("#include <emissivemap_fragment>", [
          "#include <emissivemap_fragment>",
          "float fres = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 2.5);",
          "totalEmissiveRadiance += vtEmissive + vtRim * fres;"
        ].join("\n"));
    };
    return mat;
  }

  // ---------------------------------------------------------------------------------------------
  // Particles around the rare variants

  function spriteTexture(kind) {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    if (kind === "square") {
      g.fillStyle = "#fff";
      g.fillRect(16, 16, 32, 32);
    } else if (kind === "star") {
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, "rgba(255,255,255,1)");
      r.addColorStop(0.25, "rgba(255,255,255,0.6)");
      r.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
      g.fillStyle = "#fff";
      g.beginPath();
      g.moveTo(32, 2); g.lineTo(36, 28); g.lineTo(62, 32); g.lineTo(36, 36); g.lineTo(32, 62); g.lineTo(28, 36); g.lineTo(2, 32); g.lineTo(28, 28);
      g.closePath(); g.fill();
    } else if (kind === "diamond") {
      g.fillStyle = "#fff";
      g.beginPath();
      g.moveTo(32, 4); g.lineTo(52, 32); g.lineTo(32, 60); g.lineTo(12, 32);
      g.closePath(); g.fill();
    } else {
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, "rgba(255,255,255,1)");
      r.addColorStop(0.4, "rgba(255,255,255,0.8)");
      r.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
    }
    const t = new THREE.CanvasTexture(c);
    return t;
  }
  const FX = {
    sparkle: { count: 26, sprite: "star", size: 0.32, colors: [[1, 0.85, 0.4], [1, 1, 0.8]], motion: "twinkle" },
    shard: { count: 22, sprite: "diamond", size: 0.2, colors: [[0.6, 0.9, 1], [0.9, 1, 1]], motion: "float" },
    ember: { count: 46, sprite: "dot", size: 0.16, colors: [[1, 0.35, 0.05], [1, 0.7, 0.2]], motion: "rise" },
    neon: { count: 30, sprite: "dot", size: 0.14, colors: [[0.2, 1, 0.6], [0.3, 0.9, 1]], motion: "orbit" },
    pixel: { count: 34, sprite: "square", size: 0.17, colors: [[0.6, 0.35, 1], [1, 0.35, 0.8], [0.25, 0.9, 1]], motion: "orbit" },
  };
  const textures = {};
  let particles = null;
  let particleState = [];
  function setParticles(name) {
    if (particles) {
      scene.remove(particles);
      particles.geometry.dispose();
      particles = null;
    }
    const fx = name ? FX[name] : null;
    if (!fx) return;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(fx.count * 3);
    const col = new Float32Array(fx.count * 3);
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    textures[fx.sprite] = textures[fx.sprite] || spriteTexture(fx.sprite);
    const mat = new THREE.PointsMaterial({ size: fx.size, map: textures[fx.sprite], vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    particles = new THREE.Points(geo, mat);
    particles.userData.fx = fx;
    particleState = [];
    for (let i = 0; i < fx.count; i++) {
      particleState.push({ a: Math.random() * Math.PI * 2, r: 1.5 + Math.random() * 0.8, y: Math.random() * 3, speed: 0.4 + Math.random() * 0.8, phase: Math.random() * 10, c: fx.colors[i % fx.colors.length] });
    }
    scene.add(particles);
  }
  function updateParticles(t, dt) {
    if (!particles) return;
    const fx = particles.userData.fx;
    const pos = particles.geometry.attributes.position.array;
    const col = particles.geometry.attributes.color.array;
    particleState.forEach(function (p, i) {
      let x, y, z, b = 1;
      if (fx.motion === "rise") {
        p.y += dt * p.speed * 0.9;
        if (p.y > 3.4) { p.y = 0.3 + Math.random() * 0.6; p.a = Math.random() * Math.PI * 2; p.r = 0.6 + Math.random() * 0.9; }
        x = Math.cos(p.a) * p.r + Math.sin(t * 2 + p.phase) * 0.08; z = Math.sin(p.a) * p.r; y = p.y;
        b = Math.max(0, 1 - (p.y - 0.3) / 3.1);
      } else if (fx.motion === "orbit") {
        p.a += dt * p.speed * 0.6;
        x = Math.cos(p.a) * p.r; z = Math.sin(p.a) * p.r; y = 0.4 + p.y * 0.8 + Math.sin(t + p.phase) * 0.15;
        b = 0.6 + 0.4 * Math.sin(t * 3 + p.phase);
      } else if (fx.motion === "float") {
        x = Math.cos(p.a) * p.r; z = Math.sin(p.a) * p.r; y = 0.3 + p.y * 0.85 + Math.sin(t * p.speed + p.phase) * 0.25;
        b = 0.5 + 0.5 * Math.sin(t * 2 + p.phase);
      } else {
        x = Math.cos(p.a) * p.r * 0.9; z = Math.sin(p.a) * p.r * 0.9; y = 0.3 + p.y * 0.85;
        b = Math.pow(Math.max(0, Math.sin(t * p.speed * 2.5 + p.phase)), 6);
        if (b < 0.01 && Math.random() < 0.01) { p.a = Math.random() * Math.PI * 2; p.y = Math.random() * 3; }
      }
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      col[i * 3] = p.c[0] * b; col[i * 3 + 1] = p.c[1] * b; col[i * 3 + 2] = p.c[2] * b;
    });
    particles.geometry.attributes.position.needsUpdate = true;
    particles.geometry.attributes.color.needsUpdate = true;
  }

  // ---------------------------------------------------------------------------------------------
  // Variant picker

  const list = document.getElementById("variants");
  VARIANTS.forEach(function (v, i) {
    const b = document.createElement("button");
    b.id = "variant-" + v.id;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.innerHTML = '<span class="name"><span class="dot" style="background:' + v.swatch + '"></span>' + v.id + '</span><span class="odds">' + v.odds + "</span>";
    b.addEventListener("click", function () {
      list.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      choose(i);
    });
    list.appendChild(b);
  });
  function choose(i) {
    const v = VARIANTS[i];
    uniforms.uVariant.value = i;
    current = i;
    paintBackground();
    stage.classList.toggle("showcase", i > 0);
    if (modelMaterial) modelMaterial.envMapIntensity = [0.45, 1.0, 0.9, 0.15, 0.25, 0.2][i];
    bloom.strength = v.bloom;
    badge.textContent = v.id + (i > 0 ? " · " + v.odds : "");
    setParticles(v.fx);
  }

  // ---------------------------------------------------------------------------------------------
  // Model + idle life: breathing, a little hop now and then, blinking

  let modelMaterial = null;
  const holder = new THREE.Group();
  scene.add(holder);
  function base64ToBuffer(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  new THREE.GLTFLoader().parse(base64ToBuffer(GLB), "", function (gltf) {
    gltf.scene.traverse(function (o) {
      if (o.isMesh) {
        const map = o.material.map;
        map.encoding = THREE.sRGBEncoding;
        map.magFilter = THREE.NearestFilter;
        map.minFilter = THREE.NearestFilter;
        map.generateMipmaps = false;
        o.material = makeMaterial(map);
        modelMaterial = o.material;
      }
    });
    holder.add(gltf.scene);
    choose(0);
    loading.remove();
  }, function (err) {
    loading.textContent = "The model couldn't load on this device.";
    console.error(err);
  });

  let nextHop = 3, hopStart = -10, nextBlink = 2, blinkStart = -10;
  const clock = new THREE.Clock();
  function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    uniforms.uTime.value = t;
    if (!reduced) {
      // Breathing
      let sy = 1 + 0.022 * Math.sin(t * 2.2);
      let sx = 1 - 0.011 * Math.sin(t * 2.2);
      let y = 0;
      // Hop: crouch, jump, squash on landing
      if (t > nextHop) { hopStart = t; nextHop = t + 4 + Math.random() * 3; }
      const h = t - hopStart;
      if (h < 0.12) { sy *= 1 - h * 0.8; sx *= 1 + h * 0.5; }
      else if (h < 0.57) { const k = (h - 0.12) / 0.45; y = Math.sin(k * Math.PI) * 0.45; sy *= 1.06; sx *= 0.97; }
      else if (h < 0.75) { const k = (h - 0.57) / 0.18; sy *= 1 - Math.sin(k * Math.PI) * 0.1; sx *= 1 + Math.sin(k * Math.PI) * 0.06; }
      holder.position.y = y;
      holder.scale.set(sx, sy, sx);
      shadow.scale.setScalar(1 - y * 0.6);
      shadow.material.opacity = 1 - y * 0.9;
      // Blink
      if (t > nextBlink) { blinkStart = t; nextBlink = t + 2.5 + Math.random() * 3; }
      const b = (t - blinkStart) / 0.16;
      uniforms.uBlink.value = b >= 0 && b <= 1 ? 1 - Math.sin(b * Math.PI) * 0.92 : 1;
    }
    updateParticles(t, dt);
    controls.update();
    composer.render();
  }
  renderer.setAnimationLoop(animate);

  const spin = document.getElementById("spin");
  spin.setAttribute("aria-pressed", String(controls.autoRotate));
  spin.addEventListener("click", function () {
    controls.autoRotate = !controls.autoRotate;
    spin.setAttribute("aria-pressed", String(controls.autoRotate));
  });
  document.getElementById("reset").addEventListener("click", function () {
    camera.position.copy(home);
    controls.target.set(0, 1.3, 0);
    controls.update();
  });
})();
</script>
